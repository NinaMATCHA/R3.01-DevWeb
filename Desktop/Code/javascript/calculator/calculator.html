<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Document</title>
</head>
<body>
    
    <div id="calculator">
        <input id="display" readonly>
        
        <div id="touches">
            <button onclick="ajoutADisplay('+')" class="operation">+</button>
            <button onclick="ajoutADisplay('7')">7</button>
            <button onclick="ajoutADisplay('8')">8</button>
            <button onclick="ajoutADisplay('9')">9</button>
            <button onclick="ajoutADisplay('-')" class="operation">-</button>
            <button onclick="ajoutADisplay('4')">4</button>
            <button onclick="ajoutADisplay('5')">5</button>
            <button onclick="ajoutADisplay('6')">6</button>
            <button onclick="ajoutADisplay('*')" class="operation">x</button>
            <button onclick="ajoutADisplay('1')">1</button>
            <button onclick="ajoutADisplay('2')">2</button>
            <button onclick="ajoutADisplay('3')">3</button>
            <button onclick="ajoutADisplay('/')" class="operation">/</button>
            <button onclick="calculer()">=</button>
            <button onclick="ajoutADisplay('0')">0</button>
            <button onclick="ajoutADisplay('.')">.</button>
            <button onclick="supprimerEcran()">C</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
